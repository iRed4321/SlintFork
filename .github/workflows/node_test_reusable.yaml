name: Node.js Test (Reusable)

on:
    workflow_call:
      inputs:
        name:
            description: 'Name of the job'
            required: true
            type: string
        os:
            description: 'Operating system to run on'
            required: true
            type: string

env:
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_DEV_DEBUG: 0
    CARGO_INCREMENTAL: false
    RUST_BACKTRACE: 1


jobs:
    node_test:
        name: ${{ inputs.name }}
        runs-on: ${{ inputs.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-linux-dependencies
            - uses: ./.github/actions/install-skia-dependencies
            - name: Setup headless display
              if: runner.os != 'macOS'
              uses: pyvista/setup-headless-display-action@v5
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                package-manager-cache: false
              id: node-install
            - uses: pnpm/action-setup@v6.1.0
            - uses: ./.github/actions/setup-rust
              with:
                  key: x-napi-v2-${{ steps.node-install.outputs.node-version }} # the cache key consists of a manually bumpable version and the node version, as the cached rustc artifacts contain linking information where to find node.lib, which is in a versioned directory.
            - name: Run pnpm install
              working-directory: api/node
              run: pnpm install --frozen-lockfile
            - name: Build node plugin in debug
              # build:testing builds the default binary with the `testing` feature
              # (mocked time and synthetic input) that the unit tests rely on. The
              # opt-in system-testing/MCP capabilities ship in the separate dev
              # binary and are covered by the registry e2e test (publish gate).
              run: pnpm build:testing
              working-directory: api/node
            - name: Type-check tests and registry e2e fixtures
              # Type-checked here (not in the standalone typecheck job) because the
              # specs and fixtures resolve slint-ui's types, which depend on the
              # generated bindings produced by the build above. For the same reason
              # api/node is filtered out of the root type-check:ci script.
              run: pnpm type-check
              working-directory: api/node
            - name: Build slint-compiler
              # The typescript_typegen tests invoke target/debug/slint-compiler.
              run: cargo build -p slint-compiler
            - name: Run node tests
              working-directory: api/node
              run: pnpm test
            # The registry end-to-end test (api/node/__test__/registry/e2e.test.mts)
            # runs as a gate in the npm publish workflow against the real, all-platform
            # tarballs — see publish_npm_package.yaml.
            - name: Run test-driver-nodejs
              # Release is only applied to the harness that drives the node.js invocations, but needed
              # to avoid crashing on Windows with what looks like an out of stack exception.
              run: cargo test --verbose --release --all-features --manifest-path tests/Cargo.toml -p test-driver-nodejs
            - name: Run test-driver-typescript
              run: cargo test --verbose --manifest-path tests/Cargo.toml -p test-driver-typescript
            - name: Check todo-typescript example
              working-directory: examples/todo/node-typescript
              run: pnpm check
            - name: Check image-filter example
              working-directory: examples/imagefilter/node
              run: pnpm check
            # Last, so that every step above runs on Node.js 24; `node --build-sea` needs 25.5.
            - name: Setup Node.js 26 for single executable applications
              uses: actions/setup-node@v7
              with:
                node-version: 26
                package-manager-cache: false
            - name: Test packaging as a single executable application
              working-directory: api/node
              run: pnpm exec vitest run __test__/sea.spec.mts
            - name: Package the home-automation demo as a single executable
              # Follows docs/nodejs/src/content/docs/packaging.mdx.
              shell: bash
              working-directory: demos/home-automation
              run: |
                  echo 'import("slint-ui/register").then(() => import("./main.js"));' > node/start.cjs
                  mkdir -p ../../dist
                  case "$RUNNER_OS" in
                  Windows)
                      echo 'require("node:module").createRequire(__filename)("./node/start.cjs");' > sea-main.cjs
                      npx --yes create-nodew-exe "$(node -p process.execPath)" app-node.exe
                      echo '{ "main": "sea-main.cjs", "executable": "app-node.exe", "output": "home-automation.exe", "disableExperimentalSEAWarning": true }' > sea-config.json
                      node --build-sea sea-config.json
                      mkdir ../../dist/home-automation
                      cp -RL home-automation.exe node ui ../../dist/home-automation/
                      rm -rf ../../dist/home-automation/node/node_modules/.bin
                      echo "ARTIFACT=dist/home-automation" >> "$GITHUB_ENV"
                      ;;
                  macOS)
                      app="Home Automation.app"
                      mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/app"
                      cp -RL node ui "$app/Contents/Resources/app/"
                      rm -rf "$app/Contents/Resources/app/node/node_modules/.bin"
                      cat > "$app/Contents/Info.plist" <<'PLIST'
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>CFBundleExecutable</key>
                      <string>home-automation</string>
                      <key>CFBundleIdentifier</key>
                      <string>dev.slint.home-automation</string>
                      <key>CFBundleName</key>
                      <string>Home Automation</string>
                      <key>CFBundlePackageType</key>
                      <string>APPL</string>
                      <key>NSHighResolutionCapable</key>
                      <true/>
                  </dict>
                  </plist>
                  PLIST
                      echo 'require("node:module").createRequire(__filename)("../Resources/app/node/start.cjs");' > sea-main.cjs
                      echo '{ "main": "sea-main.cjs", "output": "Home Automation.app/Contents/MacOS/home-automation", "disableExperimentalSEAWarning": true }' > sea-config.json
                      node --build-sea sea-config.json
                      codesign --sign - --force "$app"
                      # ditto keeps the executable permission and the signature.
                      ditto -c -k --keepParent "$app" ../../dist/home-automation.zip
                      echo "ARTIFACT=dist/home-automation.zip" >> "$GITHUB_ENV"
                      ;;
                  *)
                      echo 'require("node:module").createRequire(__filename)("./node/start.cjs");' > sea-main.cjs
                      echo '{ "main": "sea-main.cjs", "output": "home-automation", "disableExperimentalSEAWarning": true }' > sea-config.json
                      node --build-sea sea-config.json
                      # A tarball, since upload-artifact drops the executable permission.
                      tar czhf ../../dist/home-automation.tar.gz --exclude=.bin --transform 's,^,home-automation/,' home-automation node ui
                      echo "ARTIFACT=dist/home-automation.tar.gz" >> "$GITHUB_ENV"
                      ;;
                  esac
            - uses: actions/upload-artifact@v7
              with:
                  name: home-automation-node-${{ runner.os }}-${{ runner.arch }}
                  path: ${{ env.ARTIFACT }}
                  # The Windows folder is the only artifact that isn't compressed already.
                  compression-level: ${{ runner.os == 'Windows' && 6 || 0 }}
                  retention-days: 7
